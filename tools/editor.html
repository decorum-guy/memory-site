<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Конструктор блока — Memory Site</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #222; background: #eee8dc; }
    main { width: min(960px, calc(100% - 2rem)); margin: 3rem auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    section { padding: 1.5rem; background: #fffaf1; box-shadow: 0 1rem 2rem rgba(48,38,24,.1); }
    h1 { grid-column: 1 / -1; margin: 0; font-family: Georgia, serif; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -.04em; }
    p { line-height: 1.55; color: #615b52; }
    label { display: grid; gap: .4rem; margin-top: 1rem; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: .75rem; border: 1px solid #cfc5b4; background: #fff; font: inherit; text-transform: none; letter-spacing: normal; }
    textarea { min-height: 7rem; resize: vertical; }
    button { margin-top: 1rem; padding: .8rem 1rem; border: 0; cursor: pointer; color: #fff; background: #8c3f42; font-weight: 750; }
    pre { min-height: 28rem; margin: 0; padding: 1rem; overflow: auto; white-space: pre-wrap; background: #24211f; color: #f4ead9; font: .82rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hint { grid-column: 1 / -1; font-size: .9rem; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } h1, .hint { grid-column: 1; } }
  </style>
</head>
<body>
  <main>
    <h1>Конструктор блока</h1>
    <p class="hint">Заполни поля, скопируй получившийся объект и вставь его внутрь массива <code>blocks</code> в <code>content/memories.js</code>. Этот инструмент ничего не загружает и работает офлайн.</p>

    <section>
      <label>Тип блока
        <select id="type">
          <option value="photo">Одна фотография</option>
          <option value="video">Видео</option>
          <option value="note">Текстовая записка</option>
          <option value="quote">Цитата</option>
        </select>
      </label>
      <label>Путь к файлу
        <input id="src" value="media/photos/my-photo.jpg" />
      </label>
      <label>Заголовок / alt
        <input id="title" value="Описание фотографии" />
      </label>
      <label>Подпись
        <textarea id="caption">Почему этот момент важен.</textarea>
      </label>
      <label>Дата
        <input id="date" value="лето 2024" />
      </label>
      <label>Стиль подписи
        <select id="style">
          <option value="scribble">Рукописная</option>
          <option value="curve">По дуге</option>
          <option value="underlined">С подчёркиванием</option>
          <option value="marker">Маркером</option>
        </select>
      </label>
      <label>Наклон, градусы
        <input id="rotate" type="number" step="0.5" value="-1.5" />
      </label>
      <button id="generate" type="button">Собрать блок</button>
      <button id="copy" type="button">Скопировать код</button>
    </section>

    <section>
      <pre id="output"></pre>
    </section>
  </main>

  <script>
    const fields = ["type", "src", "title", "caption", "date", "style", "rotate"];
    const output = document.getElementById("output");
    fields.forEach((id) => document.getElementById(id).addEventListener("input", generate));
    document.getElementById("generate").addEventListener("click", generate);
    document.getElementById("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(output.textContent);
      document.getElementById("copy").textContent = "Скопировано";
      setTimeout(() => document.getElementById("copy").textContent = "Скопировать код", 1200);
    });

    function q(id) { return document.getElementById(id).value.trim(); }
    function generate() {
      const type = q("type");
      let block;
      if (type === "photo") {
        block = { type, src: q("src"), alt: q("title"), caption: q("caption"), date: q("date"), captionStyle: q("style"), rotate: Number(q("rotate")) || 0, tape: "cream" };
      } else if (type === "video") {
        block = { type, src: q("src").replace("photos", "videos").replace(/\.(jpg|jpeg|png|webp)$/i, ".mp4"), poster: "media/photos/video-cover.jpg", caption: q("caption"), date: q("date"), aspect: "portrait", rotate: Number(q("rotate")) || 0 };
      } else if (type === "quote") {
        block = { type, text: q("caption"), author: q("title"), rotate: Number(q("rotate")) || 0 };
      } else {
        block = { type: "note", text: q("caption"), style: "lined", rotate: Number(q("rotate")) || 0 };
      }
      output.textContent = JSON.stringify(block, null, 2) + ",";
    }
    generate();
  </script>
</body>
</html>
