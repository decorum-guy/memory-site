<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For You Studio · Memory Site</title>
  <style>
    :root {
      --paper: #f5ecdd;
      --ink: #2d2925;
      --muted: #75695d;
      --line: #d5c5ad;
      --accent: #9c3f43;
      --danger: #8a3636;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(120deg, #aa987f, #cdbc9f 50%, #9e896d);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: .65rem;
      flex-wrap: wrap;
      padding: .8rem 1rem;
      color: #fff;
      background: rgba(35,31,28,.95);
      backdrop-filter: blur(12px);
    }
    .studio-tabs {
      display: flex;
      gap: .25rem;
      align-items: center;
      flex: 0 0 auto;
      padding: .22rem;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
    }
    .studio-tabs a {
      border-radius: 999px;
      padding: .48rem .72rem;
      color: #e9dfd1;
      background: transparent;
      text-decoration: none;
      font-size: .72rem;
      font-weight: 850;
      white-space: nowrap;
    }
    .studio-tabs a:hover { background: rgba(255,255,255,.12); }
    .studio-tabs a.is-active { color: #2d2925; background: #f7efdf; }
    .top h1 { margin: 0 auto 0 0; font: 700 1rem Georgia, serif; }
    .top > button {
      border: 0;
      padding: .65rem .9rem;
      color: #2b2723;
      background: #f7efdf;
      font-weight: 800;
    }
    .top .primary { color: #fff; background: var(--accent); }
    .status { width: 100%; color: #d8cec0; font-size: .76rem; }

    main {
      width: min(1220px, calc(100% - 2rem));
      margin: 1rem auto 5rem;
      display: grid;
      gap: 1rem;
    }
    .panel {
      padding: 1.2rem;
      background: var(--paper);
      box-shadow: 0 1rem 2.5rem rgba(45,32,20,.2);
    }
    .intro {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 1rem;
    }
    .field { display: grid; gap: .35rem; }
    .field span { font-size: .75rem; font-weight: 800; }
    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      padding: .72rem;
      background: #fffaf2;
    }
    .field textarea { min-height: 5rem; resize: vertical; }

    .builder-head {
      display: flex;
      align-items: center;
      gap: .7rem;
      flex-wrap: wrap;
    }
    .builder-head h2 { margin: 0 auto 0 0; font: 700 1.3rem Georgia, serif; }
    .builder-head button {
      border: 1px solid var(--line);
      padding: .65rem .85rem;
      color: #6e4c25;
      background: #fffaf2;
      font-weight: 800;
    }
    .help { margin: .8rem 0 0; color: var(--muted); font-size: .86rem; line-height: 1.55; }

    .blocks {
      display: grid;
      grid-template-columns: repeat(12, minmax(0,1fr));
      grid-auto-flow: row dense;
      gap: 1rem;
      align-items: start;
    }
    .empty {
      grid-column: 1 / -1;
      padding: 3rem 1rem;
      text-align: center;
      color: var(--muted);
      border: 2px dashed rgba(75,61,45,.25);
    }
    .block {
      position: relative;
      grid-column: 1 / -1;
      padding: 1rem;
      border: 1px solid var(--line);
      background: #fff9ef;
      box-shadow: 0 .7rem 1.3rem rgba(42,31,20,.12);
      cursor: grab;
    }
    .block.note-layout-left { grid-column: 1 / span 6; transform: translate(-.35rem,.25rem); }
    .block.note-layout-right { grid-column: 7 / span 6; transform: translate(.4rem,-.2rem); }
    .block.dragging { opacity: .35; }
    .block.drop-before { box-shadow: 0 -6px 0 var(--accent), 0 .7rem 1.3rem rgba(42,31,20,.12); }
    .block-head {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: .8rem;
    }
    .block-number {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: #e9dcc7;
      font-weight: 900;
    }
    .block-kind {
      font: 800 .76rem/1 sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .block-head .spacer { flex: 1; }
    .block-head button {
      border: 0;
      padding: .45rem .6rem;
      background: #e7dac7;
      font-size: .72rem;
      font-weight: 800;
    }
    .block-head .remove { color: var(--danger); background: #f0d3d3; }

    .note-preview {
      width: fit-content;
      min-width: min(13rem,100%);
      max-width: 100%;
      margin: .4rem auto 1rem;
      padding: 1.15rem 1.35rem;
      background: #f4e4bd;
      font: 400 1.05rem/1.6 Georgia, serif;
      overflow-wrap: anywhere;
    }
    .note-preview--shape-0 { clip-path: polygon(0 5%,5% 2%,11% 6%,18% 1%,25% 5%,33% 2%,41% 6%,50% 1%,59% 5%,68% 2%,77% 6%,87% 1%,100% 5%,98% 93%,91% 97%,83% 92%,74% 98%,65% 93%,56% 98%,47% 92%,38% 97%,29% 93%,20% 98%,11% 92%,2% 96%); }
    .note-preview--shape-1 { clip-path: polygon(0 3%,8% 6%,16% 2%,24% 7%,33% 1%,43% 5%,53% 2%,63% 7%,73% 2%,84% 6%,93% 1%,100% 4%,97% 96%,89% 92%,80% 98%,70% 93%,60% 97%,50% 92%,40% 98%,30% 93%,19% 97%,9% 92%,1% 95%); }
    .note-preview--shape-2 { clip-path: polygon(0 6%,7% 1%,15% 5%,23% 2%,31% 7%,40% 1%,49% 6%,58% 2%,67% 5%,76% 1%,86% 7%,94% 2%,100% 6%,98% 94%,90% 98%,81% 93%,72% 97%,63% 92%,54% 98%,45% 93%,36% 97%,27% 92%,18% 98%,9% 93%,1% 97%); }
    .note-preview--shape-3 { clip-path: polygon(0 4%,6% 7%,14% 1%,22% 5%,30% 2%,38% 6%,47% 1%,56% 5%,65% 2%,74% 7%,83% 1%,92% 5%,100% 2%,97% 95%,88% 98%,79% 92%,70% 97%,61% 93%,52% 98%,43% 92%,34% 97%,25% 93%,16% 98%,7% 92%,1% 96%); }
    .note-preview--shape-4 { clip-path: polygon(0 2%,9% 6%,18% 1%,27% 5%,36% 2%,45% 7%,54% 1%,63% 5%,72% 2%,81% 6%,90% 1%,100% 5%,98% 97%,89% 92%,80% 98%,71% 93%,62% 97%,53% 92%,44% 98%,35% 93%,26% 97%,17% 92%,8% 98%,1% 94%); }
    .note-fields {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(12rem,.45fr);
      gap: .8rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .studio-tabs { order: -2; }
      .top h1 { order: -1; width: 100%; }
    }
    @media (max-width: 820px) {
      .intro, .note-fields { grid-template-columns: 1fr; }
      .block.note-layout-left,
      .block.note-layout-right { grid-column: 1 / -1; transform: none; }
      .top { position: relative; }
      .studio-tabs { width: 100%; }
      .studio-tabs a { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="top">
    <nav class="studio-tabs" aria-label="Разделы конструктора">
      <a href="studio.html">Memory Studio</a>
      <a class="is-active" href="telegram_studio.html" aria-current="page">For You</a>
    </nav>
    <h1>For You Studio</h1>
    <button id="reload" type="button">Перезагрузить</button>
    <button id="preview" type="button">Открыть предпросмотр</button>
    <button class="primary" id="save" type="button">Сохранить главу</button>
    <div class="status" id="status">Подключение к локальному серверу…</div>
  </header>

  <main>
    <section class="panel intro">
      <label class="field"><span>Фраза над заголовком</span><input id="kicker" /></label>
      <label class="field"><span>Главный заголовок</span><input id="title" /></label>
      <label class="field"><span>Подзаголовок</span><textarea id="subtitle"></textarea></label>
    </section>

    <section class="panel">
      <div class="builder-head">
        <h2>Пожелания</h2>
        <button id="add-note" type="button">＋ Пожелание</button>
      </div>
      <p class="help">Перетаскивай пожелания в нужном порядке. Для двух коротких карточек на одном уровне поставь первой «слева», второй — «справа»: в книге сохранятся небольшие scrapbook-смещения.</p>
    </section>

    <section class="blocks" id="blocks"></section>
  </main>

  <script>
    "use strict";

    const DEFAULTS = {
      kicker: "Несколько слов для тебя",
      title: "For You",
      subtitle: "Пожелания, которые я хочу оставить тебе рядом."
    };
    const LEGACY = {
      kicker: "Слова, которые остались",
      title: "То, что осталось в переписке",
      subtitle: "Несколько наших фраз — и слова, которые я хочу оставить тебе рядом."
    };

    let state = { ...DEFAULTS, blocks: [] };
    let dragged = -1;
    let dirty = false;
    let previewWindow = null;

    const $ = (id) => document.getElementById(id);
    const blocks = $("blocks");
    const status = $("status");
    const previewChannel = typeof BroadcastChannel === "function"
      ? new BroadcastChannel("memory-telegram-preview")
      : null;

    load();

    async function load() {
      try {
        const response = await fetch(`/api/telegram/state?rev=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("Не удалось прочитать состояние");
        const loaded = await response.json();
        const sourceBlocks = Array.isArray(loaded.blocks) ? loaded.blocks : [];
        const removed = sourceBlocks.filter((block) => block.type !== "note").length;
        state = {
          kicker: replaceLegacy(loaded.kicker, "kicker"),
          title: replaceLegacy(loaded.title, "title"),
          subtitle: replaceLegacy(loaded.subtitle, "subtitle"),
          blocks: sourceBlocks.filter((block) => block.type === "note")
        };
        $("kicker").value = state.kicker;
        $("title").value = state.title;
        $("subtitle").value = state.subtitle;
        dirty = removed > 0 || loaded.title === LEGACY.title || loaded.kicker === LEGACY.kicker || loaded.subtitle === LEGACY.subtitle;
        render();
        status.textContent = removed
          ? `Удалено старых блоков переписки: ${removed}. Нажми «Сохранить главу», чтобы закрепить новую структуру.`
          : dirty
            ? "Название обновлено до For You. Нажми «Сохранить главу», чтобы закрепить изменение."
            : "Готово. Всё работает локально и не загружается в интернет.";
      } catch (error) {
        status.textContent = `Ошибка: ${error.message}. Запусти python3 tools/memory_server.py`;
      }
    }

    function replaceLegacy(value, key) {
      const text = String(value || "").trim();
      return !text || text === LEGACY[key] ? DEFAULTS[key] : text;
    }

    function markDirty() {
      dirty = true;
      status.textContent = "Есть несохранённые изменения.";
    }

    function uid() {
      return `wish-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    }

    function previewUrl() {
      return `../index.html?telegram=1&opened=1&rev=${Date.now()}#telegram`;
    }

    function openPreview() {
      const opened = window.open(previewUrl(), "memory-site-preview");
      if (opened) {
        previewWindow = opened;
        opened.focus();
      }
    }

    function refreshOpenPreview() {
      previewChannel?.postMessage({ type: "telegram-saved", revision: Date.now() });
      if (previewWindow && !previewWindow.closed) previewWindow.location.replace(previewUrl());
    }

    function addWish() {
      state.blocks.push({
        id: uid(),
        type: "note",
        text: "",
        shape: Math.floor(Math.random() * 5),
        layout: "auto"
      });
      markDirty();
      render(true);
    }

    function render(scrollToEnd = false) {
      blocks.innerHTML = "";
      state.blocks.forEach((block, index) => blocks.appendChild(renderWish(block, index)));
      if (!state.blocks.length) blocks.innerHTML = '<div class="empty">Добавь первое пожелание.</div>';
      if (scrollToEnd) requestAnimationFrame(() => blocks.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "center" }));
    }

    function renderWish(block, index) {
      block.layout = ["left", "right"].includes(block.layout) ? block.layout : "auto";
      block.shape = Number(block.shape || 0) % 5;

      const article = document.createElement("article");
      article.className = `block note-layout-${block.layout}`;
      article.draggable = true;
      article.innerHTML = `
        <div class="block-head">
          <span class="block-number">${index + 1}</span>
          <strong class="block-kind">Пожелание</strong>
          <span class="spacer"></span>
          <button type="button" data-shape>Сменить край</button>
          <button class="remove" type="button" data-remove>Удалить</button>
        </div>
        <div class="note-preview note-preview--shape-${block.shape}">${esc(block.text || "Пожелание на бумаге")}</div>
        <div class="note-fields">
          <label class="field">
            <span>Текст пожелания</span>
            <textarea placeholder="Напиши здесь то, что хочешь оставить ей…">${esc(block.text || "")}</textarea>
          </label>
          <label class="field">
            <span>Расположение</span>
            <select data-layout>
              <option value="auto"${block.layout === "auto" ? " selected" : ""}>Авто · отдельная строка</option>
              <option value="left"${block.layout === "left" ? " selected" : ""}>Слева · половина строки</option>
              <option value="right"${block.layout === "right" ? " selected" : ""}>Справа · половина строки</option>
            </select>
          </label>
        </div>`;

      article.addEventListener("dragstart", (event) => {
        if (event.target.closest("textarea,select,button")) {
          event.preventDefault();
          return;
        }
        dragged = index;
        article.classList.add("dragging");
      });
      article.addEventListener("dragend", () => {
        dragged = -1;
        document.querySelectorAll(".drop-before").forEach((node) => node.classList.remove("drop-before"));
        article.classList.remove("dragging");
      });
      article.addEventListener("dragover", (event) => {
        event.preventDefault();
        article.classList.add("drop-before");
      });
      article.addEventListener("dragleave", () => article.classList.remove("drop-before"));
      article.addEventListener("drop", (event) => {
        event.preventDefault();
        article.classList.remove("drop-before");
        if (dragged < 0 || dragged === index) return;
        const [moved] = state.blocks.splice(dragged, 1);
        state.blocks.splice(dragged < index ? index - 1 : index, 0, moved);
        markDirty();
        render();
      });

      const preview = article.querySelector(".note-preview");
      const textarea = article.querySelector("textarea");
      textarea.addEventListener("input", (event) => {
        block.text = event.target.value;
        preview.textContent = block.text || "Пожелание на бумаге";
        markDirty();
      });
      article.querySelector("[data-layout]").addEventListener("change", (event) => {
        block.layout = event.target.value;
        markDirty();
        render();
      });
      article.querySelector("[data-shape]").addEventListener("click", () => {
        block.shape = (block.shape + 1) % 5;
        markDirty();
        render();
      });
      article.querySelector("[data-remove]").addEventListener("click", () => {
        state.blocks.splice(index, 1);
        markDirty();
        render();
      });
      return article;
    }

    ["kicker", "title", "subtitle"].forEach((id) => $(id).addEventListener("input", markDirty));
    $("add-note").addEventListener("click", addWish);
    $("preview").addEventListener("click", openPreview);
    $("reload").addEventListener("click", () => {
      if (dirty && !confirm("Перезагрузить конструктор и потерять все несохранённые изменения?")) return;
      load();
    });
    $("save").addEventListener("click", async () => {
      state.kicker = $("kicker").value.trim() || DEFAULTS.kicker;
      state.title = $("title").value.trim() || DEFAULTS.title;
      state.subtitle = $("subtitle").value.trim() || DEFAULTS.subtitle;
      state.blocks = state.blocks.filter((block) => block.type === "note");
      status.textContent = "Сохраняю…";
      try {
        const response = await fetch(`/api/telegram/save?rev=${Date.now()}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(state),
          cache: "no-store"
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Ошибка сохранения");
        dirty = false;
        refreshOpenPreview();
        status.textContent = `Сохранено пожеланий: ${result.notes}. Открытый предпросмотр обновлён автоматически.`;
      } catch (error) {
        status.textContent = `Ошибка сохранения: ${error.message}`;
      }
    });

    window.addEventListener("beforeunload", (event) => {
      if (!dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    function esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
