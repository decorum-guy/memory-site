name: Temporary current-head crop verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-current-head-crop-verification.yml"
      - "preview/trigger-current-head-crop-verification.txt"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Chromium-compatible demo media
        run: |
          python -m pip install --disable-pip-version-check Pillow qrcode
          python preview/generate_demo_media.py
          python preview/generate_extra_media.py
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -i preview/demo-media/video-poster.jpg \
            -vf "scale=1280:-2,zoompan=z='min(zoom+0.0008,1.08)':d=120:s=1280x854:fps=30" \
            -t 4 -an -c:v libvpx-vp9 -b:v 0 -crf 34 -pix_fmt yuv420p \
            preview/demo-media/demo-video.webm
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -i preview/demo-media/photo-11.jpg \
            -vf "scale=1080:-2,zoompan=z='min(zoom+0.0014,1.10)':d=90:s=1080x1440:fps=30" \
            -t 3 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            preview/demo-media/demo-live.mp4
          cp preview/demo_memories.js content/memories.js
          cp preview/demo_telegram.js content/telegram.js

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start site and execute all browser assertions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/memory-site-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node preview/capture.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-head-crop-verification
          path: preview/screenshots
          if-no-files-found: warn
          retention-days: 14
