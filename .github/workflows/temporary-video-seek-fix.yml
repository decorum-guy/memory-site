name: Temporary video preview seek fix

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/temporary_video_seek_patch.py"
      - ".github/workflows/temporary-video-seek-fix.yml"
      - "preview/trigger-video-seek-fix.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply and validate patch
        run: |
          python3 tools/temporary_video_seek_patch.py
          node --check assets/app.js
          node --check preview/capture.mjs
      - name: Commit runtime and test fix
        run: |
          rm -f preview/crop-editor-verification.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js preview/capture.mjs preview/crop-editor-verification.txt
          git commit -m "fix: seek selected video preview frame reliably"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
