name: Crop editor and cursor functional verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/media.css"
      - "assets/cursor-*.css"
      - "assets/cursors/**"
      - "tools/studio.html"
      - "preview/demo_memories.js"
      - "preview/verify_cursor_states.mjs"
      - "preview/verify_crop_editor.mjs"
      - "preview/capture.mjs"
      - ".github/workflows/crop-editor-functional.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate demo media
        run: |
          python -m pip install --disable-pip-version-check Pillow qrcode
          python preview/generate_demo_media.py
          python preview/generate_extra_media.py
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -i preview/demo-media/video-poster.jpg \
            -vf "scale=1280:-2,zoompan=z='min(zoom+0.0008,1.08)':d=120:s=1280x854:fps=30" \
            -t 4 -an -c:v libvpx-vp9 -b:v 0 -crf 34 -pix_fmt yuv420p \
            preview/demo-media/demo-video.webm
          cp preview/demo_memories.js content/memories.js

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run focused functional verification
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/memory-site-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node preview/verify_cursor_states.mjs
          node preview/verify_crop_editor.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crop-editor-functional-report
          path: preview/crop-verification-output
          if-no-files-found: warn
          retention-days: 14
