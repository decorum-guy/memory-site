name: Design preview screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "content/**"
      - "tools/studio.html"
      - "tools/telegram_*"
      - "preview/**"
      - ".github/workflows/design-preview.yml"
      - "!preview/screenshots/**"
      - "!preview/STATUS.md"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "content/**"
      - "tools/studio.html"
      - "tools/telegram_*"
      - "preview/**"
      - ".github/workflows/design-preview.yml"
      - "!preview/screenshots/**"
      - "!preview/STATUS.md"

permissions:
  contents: write

concurrency:
  group: design-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Stabilize selected video frame verification
        run: |
          python - <<'PY'
          from pathlib import Path

          robust_wait = '''await {locator}.evaluate((video, expected) => new Promise((resolve, reject) => {{
            const started = performance.now();
            const deadline = started + 15000;
            const events = ["loadedmetadata", "loadeddata", "seeked", "timeupdate", "canplay"];
            let timer = 0;
            let nudging = false;
            let settled = false;

            const cleanup = () => {{
              window.clearInterval(timer);
              events.forEach((name) => video.removeEventListener(name, check));
            }};

            const finish = () => {{
              if (settled) return;
              settled = true;
              cleanup();
              video.pause();
              resolve();
            }};

            const fail = () => {{
              if (settled) return;
              settled = true;
              cleanup();
              reject(new Error(`Timed out waiting for selected frame ${{expected}}; current=${{video.currentTime}}; readyState=${{video.readyState}}`));
            }};

            const nudgeDecode = async () => {{
              if (nudging || video.readyState < 1 || settled) return;
              nudging = true;
              video.muted = true;
              try {{ await video.play(); }} catch {{}}
              try {{
                if (typeof video.fastSeek === "function") video.fastSeek(expected);
                else video.currentTime = expected;
              }} catch {{}}
              window.setTimeout(() => {{ nudging = false; }}, 300);
            }};

            const check = () => {{
              if (video.readyState >= 2 && Math.abs(video.currentTime - expected) <= .35) {{
                finish();
                return;
              }}
              const now = performance.now();
              if (now >= deadline) {{
                fail();
                return;
              }}
              if (now - started >= 3000) void nudgeDecode();
            }};

            events.forEach((name) => video.addEventListener(name, check));
            timer = window.setInterval(check, 120);
            check();
          }}), 1.2);'''

          verify = Path("preview/verify_crop_editor.mjs")
          text = verify.read_text(encoding="utf-8")
          old = '''  const selectedVideo = reader.locator('[data-media-key="d05"] video').first();
          await selectedVideo.scrollIntoViewIfNeeded();
          await reader.waitForFunction(() => {
            const video = document.querySelector('[data-media-key="d05"] video');
            return Boolean(video && video.readyState >= 2 && Math.abs(video.currentTime - 1.2) <= .35);
          }, null, { timeout: 15000 });'''
          new = '''  const selectedVideo = reader.locator('[data-media-key="d05"] video').first();
          await selectedVideo.waitFor({ state: "attached" });
          await selectedVideo.scrollIntoViewIfNeeded();
          ''' + robust_wait.format(locator="selectedVideo")
          if old not in text and "const started = performance.now();" not in text:
              raise SystemExit("focused selected-video block not found")
          if old in text:
              verify.write_text(text.replace(old, new, 1), encoding="utf-8")

          capture = Path("preview/capture.mjs")
          text = capture.read_text(encoding="utf-8")
          old = '''await selectedVideoPreview.evaluate((video, expected) => new Promise((resolve, reject) => {
            const deadline = performance.now() + 12000;
            const check = () => {
              if (Math.abs(video.currentTime - expected) <= .35 && video.readyState >= 2) {
                resolve();
                return;
              }
              if (performance.now() >= deadline) {
                reject(new Error(`Timed out waiting for selected frame ${expected}; current=${video.currentTime}; readyState=${video.readyState}`));
                return;
              }
              window.setTimeout(check, 80);
            };
            ["loadedmetadata", "loadeddata", "seeked", "timeupdate", "canplay"].forEach((name) => video.addEventListener(name, check));
            check();
          }), 1.2);'''
          new = robust_wait.format(locator="selectedVideoPreview")
          if old not in text and "const started = performance.now();" not in text:
              raise SystemExit("capture selected-video block not found")
          if old in text:
              text = text.replace(old, new, 1)
          old_state = '''const selectedVideoState = await selectedVideoPreview.evaluate((video) => ({
            currentTime: video.currentTime,
            objectPosition: getComputedStyle(video).objectPosition
          }));'''
          new_state = '''const selectedVideoState = await selectedVideoPreview.evaluate((video) => ({
            currentTime: video.currentTime,
            objectPosition: getComputedStyle(video).objectPosition,
            paused: video.paused
          }));'''
          if old_state in text:
              text = text.replace(old_state, new_state, 1)
          pause_anchor = '''if (!selectedVideoState.objectPosition.includes("68%") || !selectedVideoState.objectPosition.includes("34%")) {
            throw new Error(`Saved video crop was not applied: ${selectedVideoState.objectPosition}`);
          }'''
          pause_check = pause_anchor + '''
          if (!selectedVideoState.paused) {
            throw new Error("Selected video preview frame is still playing");
          }'''
          if "Selected video preview frame is still playing" not in text:
              if pause_anchor not in text:
                  raise SystemExit("capture pause assertion anchor not found")
              text = text.replace(pause_anchor, pause_check, 1)
          capture.write_text(text, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate temporary demo media
        run: |
          python -m pip install --disable-pip-version-check Pillow qrcode
          python preview/generate_demo_media.py
          python preview/generate_extra_media.py
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          # VP9/WebM is used for this fixture because open-source Chromium in CI
          # does not include the proprietary H.264 decoder. Production MP4 files
          # remain supported by regular Chrome, Yandex Browser and Safari.
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -i preview/demo-media/video-poster.jpg \
            -vf "scale=1280:-2,zoompan=z='min(zoom+0.0008,1.08)':d=120:s=1280x854:fps=30" \
            -t 4 -an -c:v libvpx-vp9 -b:v 0 -crf 34 -pix_fmt yuv420p \
            preview/demo-media/demo-video.webm
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -i preview/demo-media/photo-11.jpg \
            -vf "scale=1080:-2,zoompan=z='min(zoom+0.0014,1.10)':d=90:s=1080x1440:fps=30" \
            -t 3 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            preview/demo-media/demo-live.mp4

      - name: Activate demo content
        run: |
          cp preview/demo_memories.js content/memories.js
          cp preview/demo_telegram.js content/telegram.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/memory-site-server.log 2>&1 &
          echo $! > /tmp/memory-site-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/memory-site-server.log
          exit 1

      - name: Capture desktop and mobile screenshots
        id: capture
        continue-on-error: true
        env:
          PW_TEST_SCREENSHOT_NO_FONTS_READY: "1"
        run: |
          set -o pipefail
          node preview/capture.mjs 2>&1 | tee preview/capture.log

      - name: Write preview status
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          {
            echo "# Design Preview Status"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Result: **${CAPTURE_OUTCOME}**"
            if [ "${CAPTURE_OUTCOME}" != "success" ]; then
              echo
              echo "## Последние строки ошибки"
              echo '```text'
              tail -n 80 preview/capture.log 2>/dev/null || true
              echo '```'
            fi
          } > preview/STATUS.md

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-site-design-preview
          path: |
            preview/screenshots
            preview/STATUS.md
          if-no-files-found: warn
          retention-days: 14

      - name: Restore project and clean temporary files
        if: always()
        run: |
          git checkout -- content/memories.js content/telegram.js
          rm -rf preview/demo-media node_modules package.json package-lock.json
          rm -f media/telegram/chat-* preview/capture.log

      - name: Publish screenshots and verification fixes into current branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview/screenshots preview/STATUS.md preview/capture.mjs preview/verify_crop_editor.mjs || true
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "chore(preview): refresh screenshots and stabilize video verification [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Mark failed capture
        if: steps.capture.outcome != 'success'
        run: exit 1
