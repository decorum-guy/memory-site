name: Temporary source export

on:
  pull_request:
    branches: [main]
    paths:
      - "preview/trigger-source-export.txt"
      - ".github/workflows/temporary-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Pack branch source
        run: |
          mkdir -p /tmp/source-export
          rsync -a --exclude '.git' --exclude '.memory-test' --exclude 'node_modules' ./ /tmp/source-export/memory-site/
          cd /tmp/source-export
          zip -qr memory-site-source.zip memory-site
      - uses: actions/upload-artifact@v4
        with:
          name: memory-site-source
          path: /tmp/source-export/memory-site-source.zip
          retention-days: 2
