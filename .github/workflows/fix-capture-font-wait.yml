name: Fix capture font wait

on:
  push:
    branches: [review-round-2-polish]
    paths:
      - ".github/workflows/fix-capture-font-wait.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-round-2-polish
          fetch-depth: 0

      - name: Bound document font waiting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("preview/capture.mjs")
          text = path.read_text(encoding="utf-8")
          old = "    if (document.fonts?.ready) await document.fonts.ready;"
          new = "    if (document.fonts?.ready) {\n      await Promise.race([\n        document.fonts.ready,\n        new Promise((resolve) => window.setTimeout(resolve, 3000)),\n      ]);\n    }"
          if old not in text and "window.setTimeout(resolve, 3000)" not in text:
              raise SystemExit("font wait anchor not found")
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit capture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/capture.mjs
          if git diff --cached --quiet; then
            echo "Capture font wait already bounded"
          else
            git commit -m "fix(preview): bound font readiness wait"
            git push origin HEAD:review-round-2-polish
          fi
