name: Import workflow safety test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/import_workflow.py"
      - "tools/import_memories.py"
      - "tools/studio_workflow.py"
      - "preview/generate_demo_media.py"
      - ".github/workflows/import-workflow-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/import_workflow.py"
      - "tools/import_memories.py"
      - "tools/studio_workflow.py"
      - "preview/generate_demo_media.py"
      - "preview/trigger-importer-studio-fix.txt"
      - ".github/workflows/import-workflow-test.yml"

permissions:
  contents: write

jobs:
  test-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply Python 3.9 compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/import_memories.py")
          text = path.read_text(encoding="utf-8")
          old = 'hamming = (a.dhash ^ b.dhash).bit_count() / 64.0'
          new = 'hamming = bin(a.dhash ^ b.dhash).count("1") / 64.0'
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Не найдена ожидаемая строка visual_similarity")
          PY
          if ! git diff --quiet -- tools/import_memories.py; then
            git config user.name "github-actions[bot]"
            git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
            git add tools/import_memories.py
            git commit -m "fix: support Python 3.9 bit counting"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl
          python -m pip install --disable-pip-version-check Pillow pillow-heif

      - name: Generate test media
        run: |
          python preview/generate_demo_media.py
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -i preview/demo-media/video-poster.jpg \
            -t 2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            preview/demo-media/test-video.mp4

      - name: Remember production checksum
        run: shasum content/memories.js > /tmp/memories.before

      - name: Dry run changes nothing
        run: |
          python tools/import_workflow.py dry-run preview/demo-media
          shasum -c /tmp/memories.before
          test ! -e .memory-test

      - name: Isolated test import
        run: |
          python tools/import_workflow.py test preview/demo-media
          test -f .memory-test/site/index.html
          test -f .memory-test/site/content/memories.js
          test -f .memory-test/site/content/import-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.memory-test/site/content/import-report.json').read_text())
          assert report.get('errors') == [], report
          assert report.get('importedItems', 0) > 0, report
          PY
          shasum -c /tmp/memories.before

      - name: Rehearse Studio export application
        run: |
          cp .memory-test/site/content/memories.js /tmp/memories.js
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/memories.js')
          text = path.read_text(encoding='utf-8').replace('"title": "Наши три года"', '"title": "Тестовая правка"', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python tools/studio_workflow.py apply test /tmp/memories.js
          grep -q 'Тестовая правка' .memory-test/site/content/memories.js
          shasum -c /tmp/memories.before

      - name: Reset test area only
        run: |
          python tools/import_workflow.py reset test --yes
          test ! -e .memory-test
          shasum -c /tmp/memories.before
