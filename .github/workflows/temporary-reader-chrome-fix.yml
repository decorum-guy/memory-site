name: Temporary reader chrome fix

on:
  pull_request:
    branches: [main]
    paths:
      - "preview/trigger-reader-chrome-fix.txt"
      - "tools/temporary_reader_chrome_patch.py"
      - ".github/workflows/temporary-reader-chrome-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: python3 tools/temporary_reader_chrome_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js tools/studio_workflow.py preview/capture.mjs
          git commit -m "fix: restore reader chrome after Studio apply"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
