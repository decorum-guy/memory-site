name: Finalize review branch and install cursor

on:
  push:
    branches: [review-round-2-polish]
    paths:
      - ".github/workflows/finalize-review-cursor.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-round-2-polish
          fetch-depth: 0

      - name: Install cursor, keep focused tests, and remove temporary CI files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          
          root = Path.cwd()
          
          def write_b64(path, payload):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(payload))
          
          write_b64("assets/cursor-scrapbook-pencil-final-v19.css", "")
          write_b64("assets/cursors/scrapbook-pencil-final-v19.svg", "")
          write_b64("assets/cursors/scrapbook-pencil-final-v19.png", "")
          write_b64(".github/workflows/crop-editor-functional.yml", "")
          
          index = root / "index.html"
          text = index.read_text(encoding="utf-8")
          link = '  <link rel="stylesheet" href="assets/cursor-scrapbook-pencil-final-v19.css" />\n'
          anchor = '  <link rel="stylesheet" href="assets/shared-and-telegram.css" />\n'
          if link not in text:
              if anchor not in text:
                  raise SystemExit("index stylesheet anchor not found")
              text = text.replace(anchor, anchor + link)
          index.write_text(text, encoding="utf-8")
          
          verify = root / "preview/verify_crop_editor.mjs"
          text = verify.read_text(encoding="utf-8")
          needle = '  await reader.goto(`${base}/?opened=1#ordinary-days`, { waitUntil: "networkidle" });\n\n  const croppedPhoto ='
          insert = '  await reader.goto(`${base}/?opened=1#ordinary-days`, { waitUntil: "networkidle" });\n\n'     '  const cursorState = await reader.evaluate(() => ({\n'     '    finePointer: matchMedia("(hover: hover) and (pointer: fine)").matches,\n'     '    bodyCursor: getComputedStyle(document.body).cursor,\n'     '    openButtonCursor: getComputedStyle(document.getElementById("open-book")).cursor,\n'     '    stylesheetLoaded: [...document.styleSheets].some((sheet) =>\n'     '      String(sheet.href || "").includes("cursor-scrapbook-pencil-final-v19.css")\n'     '    ),\n'     '  }));\n'     '  assert(cursorState.stylesheetLoaded, `custom cursor stylesheet was not loaded: ${JSON.stringify(cursorState)}`);\n'     '  assert(cursorState.finePointer, `desktop Chromium did not expose a fine pointer: ${JSON.stringify(cursorState)}`);\n'     '  assert(cursorState.bodyCursor.includes("scrapbook-pencil-final-v19"), `custom body cursor was not applied: ${JSON.stringify(cursorState)}`);\n'     '  assert(cursorState.openButtonCursor.includes("scrapbook-pencil-final-v19"), `custom interactive cursor was not applied: ${JSON.stringify(cursorState)}`);\n\n'     '  const croppedPhoto ='
          if "const cursorState =" not in text:
              if needle not in text:
                  raise SystemExit("verify cursor insertion anchor not found")
              text = text.replace(needle, insert)
          report_needle = '    photoPosition,\n    readerVideoState,'
          if "    cursorState," not in text:
              if report_needle not in text:
                  raise SystemExit("verify report anchor not found")
              text = text.replace(report_needle, '    cursorState,\n' + report_needle)
          verify.write_text(text, encoding="utf-8")
          
          checklist = root / "REVIEW_ROUND_2_CHECKLIST.md"
          if checklist.exists():
              current = checklist.read_text(encoding="utf-8")
              if "## Кадрирование и кастомный курсор" not in current:
                  checklist.write_text(current + '\n\n## Кадрирование и кастомный курсор\n\n- [ ] Навести курсор на фото, видео и Live Photo в Studio: появляется кнопка настройки кадра.\n- [ ] Перетащить фото внутри полароида, сохранить, открыть повторно и проверить сохранённое положение.\n- [ ] Изменить положение и нажать «Отмена»: предыдущее сохранённое положение не меняется.\n- [ ] Для видео выбрать кадр по таймлайну и проверить «Сохранить», «Сохранить и выйти» и «Отмена».\n- [ ] Для Live Photo доступно кадрирование статичного фото, но нет таймлайна обычного видео.\n- [ ] На десктопе книга использует оранжевый карандаш с hotspot на грифеле; в Studio остаётся системный курсор.\n- [ ] На тач-устройстве кастомный курсор не влияет на интерфейс.\n', encoding="utf-8")
          
          verification = root / "preview/CROP_EDITOR_VERIFICATION.md"
          if verification.exists():
              current = verification.read_text(encoding="utf-8")
              if "## Cursor verification" not in current:
                  verification.write_text(current + '\n\n## Cursor verification\n\nThe focused Chromium test also verifies that the cursor stylesheet is loaded and that the pencil cursor is applied to the book and its interactive controls on fine-pointer devices. Studio intentionally keeps the system cursor.\n', encoding="utf-8")
          
          for rel in [
              ".github/workflows/temporary-capture-visibility-fix.yml",
              ".github/workflows/temporary-current-head-crop-verification.yml",
              "preview/trigger-capture-visibility-fix.txt",
              "preview/trigger-current-head-crop-verification.txt",
              "tools/temporary_capture_visibility_patch.py",
              ".github/workflows/finalize-review-cursor.yml",
          ]:
              path = root / rel
              if path.exists():
                  path.unlink()
          PY

      - name: Commit clean review state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add custom cursor and finalize crop editor review"
          git push origin HEAD:review-round-2-polish
