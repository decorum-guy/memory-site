name: Finish cursor integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/finalize-review-cursor.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-round-2-polish
          fetch-depth: 0

      - name: Extend verification and clean non-workflow helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          verify = root / "preview/verify_crop_editor.mjs"
          text = verify.read_text(encoding="utf-8")
          needle = '  await reader.goto(`${base}/?opened=1#ordinary-days`, { waitUntil: "networkidle" });\n\n  const croppedPhoto ='
          insert = '''  await reader.goto(`${base}/?opened=1#ordinary-days`, { waitUntil: "networkidle" });

  const cursorState = await reader.evaluate(() => ({
    finePointer: matchMedia("(hover: hover) and (pointer: fine)").matches,
    bodyCursor: getComputedStyle(document.body).cursor,
    openButtonCursor: getComputedStyle(document.getElementById("open-book")).cursor,
    stylesheetLoaded: [...document.styleSheets].some((sheet) =>
      String(sheet.href || "").includes("cursor-scrapbook-pencil-final-v19.css")
    ),
  }));
  assert(cursorState.stylesheetLoaded, `custom cursor stylesheet was not loaded: ${JSON.stringify(cursorState)}`);
  assert(cursorState.finePointer, `desktop Chromium did not expose a fine pointer: ${JSON.stringify(cursorState)}`);
  assert(cursorState.bodyCursor.includes("scrapbook-pencil-final-v19"), `custom body cursor was not applied: ${JSON.stringify(cursorState)}`);
  assert(cursorState.openButtonCursor.includes("scrapbook-pencil-final-v19"), `custom interactive cursor was not applied: ${JSON.stringify(cursorState)}`);

  const croppedPhoto ='''
          if "const cursorState =" not in text:
              if needle not in text:
                  raise SystemExit("cursor assertion insertion anchor not found")
              text = text.replace(needle, insert)
          report_needle = '  const report = {\n    photoPosition,'
          if "  const report = {\n    cursorState," not in text:
              if report_needle not in text:
                  raise SystemExit("cursor report insertion anchor not found")
              text = text.replace(report_needle, '  const report = {\n    cursorState,\n    photoPosition,')
          verify.write_text(text, encoding="utf-8")

          checklist = root / "REVIEW_ROUND_2_CHECKLIST.md"
          current = checklist.read_text(encoding="utf-8")
          if "## Кадрирование и кастомный курсор" not in current:
              current += '''

## Кадрирование и кастомный курсор

- [ ] Навести курсор на фото, видео и Live Photo в Studio: появляется кнопка настройки кадра.
- [ ] Перетащить фото внутри полароида, сохранить, открыть повторно и проверить сохранённое положение.
- [ ] Изменить положение и нажать «Отмена»: предыдущее сохранённое положение не меняется.
- [ ] Для видео выбрать кадр по таймлайну и проверить «Сохранить», «Сохранить и выйти» и «Отмена».
- [ ] Для Live Photo доступно кадрирование статичного фото, но нет таймлайна обычного видео.
- [ ] На десктопе книга использует оранжевый карандаш с hotspot на грифеле; в Studio остаётся системный курсор.
- [ ] На тач-устройстве кастомный курсор не влияет на интерфейс.
'''
              checklist.write_text(current, encoding="utf-8")

          verification = root / "preview/CROP_EDITOR_VERIFICATION.md"
          current = verification.read_text(encoding="utf-8")
          if "## Cursor verification" not in current:
              current += '''

## Cursor verification

The focused Chromium test also verifies that the cursor stylesheet is loaded and that the pencil cursor is applied to the book and its interactive controls on fine-pointer devices. Studio intentionally keeps the system cursor.
'''
              verification.write_text(current, encoding="utf-8")

          for rel in [
              "preview/trigger-capture-visibility-fix.txt",
              "preview/trigger-current-head-crop-verification.txt",
              "tools/temporary_capture_visibility_patch.py",
          ]:
              path = root / rel
              if path.exists():
                  path.unlink()
          PY

      - name: Commit non-workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No non-workflow changes"
          else
            git commit -m "test: verify custom cursor and clean review helpers"
            git push origin HEAD:review-round-2-polish
          fi
