name: Install cursor PNG fallback

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/finalize-review-cursor.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-round-2-polish
          fetch-depth: 0

      - name: Write PNG cursor fallback
        run: |
          mkdir -p assets/cursors
          printf '%s' '' | base64 --decode > assets/cursors/scrapbook-pencil-final-v19.png

      - name: Commit PNG fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cursors/scrapbook-pencil-final-v19.png
          if git diff --cached --quiet; then
            echo "PNG fallback already present"
          else
            git commit -m "feat: add pencil cursor PNG fallback"
            git push origin HEAD:review-round-2-polish
          fi
