name: Temporary capture visibility fix

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/temporary_capture_visibility_patch.py"
      - ".github/workflows/temporary-capture-visibility-fix.yml"
      - "preview/trigger-capture-visibility-fix.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply and validate capture patch
        run: |
          python3 tools/temporary_capture_visibility_patch.py
          node --check preview/capture.mjs
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/capture.mjs
          git commit -m "test: verify selected frame after preview becomes visible"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
