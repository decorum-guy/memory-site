name: Complete event page verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/app.js"
      - "assets/event-page-expansion.js"
      - "assets/reader-layout-fixes.css"
      - "assets/memory-book-icon.svg"
      - "preview/verify_event_pages.mjs"
      - ".github/workflows/event-page-functional.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare thirteen-item event fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          long_caption = (
              "Это специально очень длинное описание карточки, которое должно переноситься внутри нижней полоски, "
              "не заходить на фотографию и после четвёртой строки аккуратно заканчиваться многоточием. "
              "ДажеОченьДлинноеСловоБезПробеловТожеОбязаноПеренестисьВнутриДопустимойШириныКарточки."
          )
          items = []
          for index in range(13):
              items.append({
                  "id": f"large-{index + 1:02d}",
                  "kind": "photo",
                  "src": "preview/demo-media/photo-01.jpg",
                  "thumb": "preview/demo-media/photo-01.jpg",
                  "caption": long_caption if index == 0 else f"Карточка {index + 1}",
                  "takenAt": f"2026-07-10T12:{index:02d}:00",
                  "censored": False,
              })
          book = {
              "meta": {"title": "Проверка большой страницы", "accent": "#9c3f43"},
              "chapters": [{
                  "id": "year-2026",
                  "number": "2026",
                  "kicker": "Глава по времени",
                  "title": "2026",
                  "layout": "wide",
                  "theme": "ochre",
                  "blocks": [{
                      "type": "event",
                      "id": "large-event",
                      "title": "10 июля 2026",
                      "caption": "Все файлы должны быть видны без раскрытия.",
                      "layout": "stack",
                      "items": items,
                  }],
              }],
          }
          Path("content/memories.js").write_text(
              "window.MEMORY_BOOK = " + json.dumps(book, ensure_ascii=False, indent=2) + ";\n",
              encoding="utf-8",
          )
          PY
          node --check assets/event-page-expansion.js
          node --check preview/verify_event_pages.mjs
          test -f assets/memory-book-icon.svg

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify complete event rendering
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/event-page-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node preview/verify_event_pages.mjs
